
name: Build Frost Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Compile Fabric client mod
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --no-daemon --console=plain 2>&1 | tee build.log
          mkdir -p release
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrostClient-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload installable client JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrostClient-v0.2.0-1.21.11
          path: release/*.jar
          if-no-files-found: error
